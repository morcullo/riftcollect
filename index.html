<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RiftCollect</title>
<style>
:root{--bg:#0b0c0e;--p:#151619;--p2:#1b1c20;--line:#292b30;--text:#f7f5f0;--muted:#909198;--orange:#f28a35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 50% -5%,#2a1d13 0,#0b0c0e 36%)}main{max-width:760px;margin:auto;padding:26px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;margin:7px 0 25px}.ey{font-size:10px;letter-spacing:.18em;color:#aaa;font-weight:800}.title{margin:4px 0 0;font-size:30px;letter-spacing:-.05em}.add{border:0;background:var(--orange);color:#17110c;width:44px;height:44px;border-radius:15px;font-size:24px}.value{background:linear-gradient(145deg,#211b17,#151619);border:1px solid var(--line);border-radius:24px;padding:24px}.value label{font-size:10px;letter-spacing:.15em;color:#999;font-weight:800}.value strong{display:block;font-size:40px;margin:5px 0 13px;letter-spacing:-.05em}.meta{display:flex;gap:20px;color:var(--muted);font-size:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 12px}.section h2{font-size:18px;margin:0}.section small{color:var(--muted)}.search{height:48px;border:1px solid var(--line);background:var(--p);border-radius:15px;display:flex;align-items:center;padding:0 13px;gap:10px;margin-bottom:14px}.search input{flex:1;background:none;border:0;outline:0;color:white;font-size:14px}.rows{display:grid;gap:8px}.row{display:flex;gap:12px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:9px}.row img{width:48px;height:67px;object-fit:cover;border-radius:7px;background:#24262a}.grow{flex:1}.row b,.tile b{display:block;font-size:13px}.row span,.tile span{font-size:11px;color:var(--muted);display:block;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:var(--p)}.tile>img{width:100%;aspect-ratio:744/1039;object-fit:cover;display:block}.ti{padding:11px}.tb{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.controls{display:flex;gap:5px}.controls button{width:27px;height:27px;border-radius:8px;border:1px solid #38393e;background:#222328;color:#bbb}.empty{text-align:center;padding:55px 25px;color:var(--muted)}.empty h3{color:white}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800}.primary{background:var(--orange);color:#17110c}.secondary{background:#242529;color:#ddd;margin-top:8px}.error{padding:12px;border-radius:12px;background:#281b15;color:#e7ad82;font-size:12px;line-height:1.45}nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:#111216ed;border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:center;gap:min(22vw,150px);align-items:center;z-index:10}nav button{border:0;background:none;color:#777;font-size:10px;font-weight:700}nav .active{color:var(--orange)}nav .navadd{width:54px;height:54px;border-radius:18px;background:var(--orange);color:#17110c;font-size:25px}.wrap{position:fixed;z-index:20;inset:0;background:#000b;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:#17181b;border:1px solid #303238;border-bottom:0;border-radius:26px 26px 0 0;max-height:90vh;overflow:auto;padding:10px 18px 28px}.grab{width:38px;height:4px;background:#4a4b50;border-radius:5px;margin:3px auto 18px}.sh{display:flex;justify-content:space-between;align-items:center}.sh h2{margin:0;font-size:21px}.sh p{margin:4px 0 16px;color:var(--muted);font-size:12px}.close{background:#242529;color:#aaa;border:1px solid var(--line);border-radius:12px;width:36px;height:36px;font-size:19px}.results{display:grid;gap:7px}.result{display:flex;align-items:center;gap:11px;width:100%;padding:8px;background:#1d1e22;color:white;border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer}.result img{width:43px;height:60px;object-fit:cover;border-radius:6px}.result .grow small{display:block;color:#888;margin-top:4px}.muted{text-align:center;color:#777;padding:30px;font-size:13px}.hero{display:block;height:290px;max-width:210px;object-fit:contain;margin:0 auto 12px;border-radius:12px}.selected{text-align:center}.selected h3{margin:8px 0 4px}.selected p{font-size:12px;color:#888}.qty{display:flex;justify-content:center;gap:20px;align-items:center;margin:17px}.qty button{width:38px;height:38px;border-radius:12px;background:#242529;border:1px solid #38393e;color:#ccc}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:0 20px}.sheet{border:1px solid #303238;border-radius:26px;margin-bottom:20px}}
</style>
</head>
<body><div class="app"><main id="main"></main></div><nav id="nav"></nav><div id="modal"></div>
<script>
let page="home",items=JSON.parse(localStorage.getItem("riftcollect")||"[]"),timer;
const money=n=>"$"+Number(n||0).toFixed(2),img=c=>c.imageUrl||"",save=()=>localStorage.setItem("riftcollect",JSON.stringify(items));
function add(c,q){let x=items.find(v=>v.id===c.id);x?x.qty+=q:items.push({...c,qty:q});save();close();render()}
function ch(id,d){items=items.map(x=>x.id===id?{...x,qty:x.qty+d}:x).filter(x=>x.qty>0);save();render()}
function nav(){document.getElementById("nav").innerHTML=`<button class="${page==="home"?"active":""}" onclick="page='home';render()">⌂<br>Home</button><button class="navadd" onclick="openAdd()">＋</button><button class="${page==="collection"?"active":""}" onclick="page='collection';render()">▦<br>Collection</button>`}
function empty(){return `<div class="empty"><div style="font-size:35px;color:var(--orange)">▱</div><h3>Your collection is empty</h3><p>Add your first Riftbound card using TCGCSV pricing data.</p><button class="primary" onclick="openAdd()">＋ Add card</button></div>`}
function row(c){return `<div class="row"><img src="${img(c)}"><div class="grow"><b>${c.name}</b><span>${c.setName} · ${c.rarity||"Card"} · ${c.subTypeName||"Normal"}</span></div><strong>${c.qty}×</strong></div>`}
function home(){let total=items.reduce((s,c)=>s+(c.marketPrice||0)*c.qty,0),n=items.reduce((s,c)=>s+c.qty,0);return `<header><div><div class="ey">RIFTCOLLECT</div><h1 class="title">Your collection</h1></div><button class="add" onclick="openAdd()">＋</button></header><section class="value"><label>COLLECTION VALUE</label><strong>${money(total)}</strong><div class="meta"><span>${n} cards</span><span>${items.length} unique</span></div></section><div class="section"><h2>Recently added</h2><small>${items.length}</small></div>${items.length?`<div class="rows">${items.slice(-6).reverse().map(row).join("")}</div>`:empty()}`}
function cardGrid(list){if(!list.length)return empty();return `<div class="grid">${list.map(c=>`<div class="tile"><img src="${img(c)}"><div class="ti"><b>${c.name}</b><span>${c.setName} · ${c.rarity||"Card"}</span><div class="tb"><strong>${c.qty}× · ${money(c.marketPrice)}</strong><div class="controls"><button onclick="ch('${c.id}',-1)">−</button><button onclick="ch('${c.id}',1)">＋</button></div></div></div></div>`).join("")}</div>`}
function collection(){return `<header><div><div class="ey">YOUR CARDS</div><h1 class="title">Collection</h1></div><button class="add" onclick="openAdd()">＋</button></header><div class="search">⌕<input placeholder="Search your collection..." oninput="filter(this.value)"></div><div id="grid">${cardGrid(items)}</div>`}
function filter(q){document.getElementById("grid").innerHTML=cardGrid(items.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())))}
function openAdd(){document.getElementById("modal").innerHTML=`<div class="wrap" onclick="if(event.target===this)close()"><div class="sheet"><div class="grab"></div><div class="sh"><div><h2>Add to collection</h2><p>Search TCGCSV / TCGplayer data</p></div><button class="close" onclick="close()">×</button></div><div class="search">⌕<input id="sq" autofocus placeholder="Search card name..." oninput="search(this.value)"></div><div id="results"><div class="muted">Start typing a card name</div></div></div></div>`}
function close(){document.getElementById("modal").innerHTML=""}
async function search(q){clearTimeout(timer);let box=document.getElementById("results");if(q.trim().length<2){box.innerHTML='<div class="muted">Start typing a card name</div>';return}box.innerHTML='<div class="muted">Searching TCGCSV…</div>';timer=setTimeout(async()=>{try{let r=await fetch("/api/search?q="+encodeURIComponent(q.trim()));let d=await r.json();if(!r.ok)throw Error(d.error||"Search failed");window.results=d.results;box.innerHTML=d.results.length?d.results.map((c,i)=>`<button class="result" onclick="select(${i})"><img src="${img(c)}"><div class="grow"><b>${c.name}</b><small>${c.setName} · ${c.cardNumber||""} · ${c.rarity||"Card"} · ${c.subTypeName||"Normal"} · ${money(c.marketPrice)} market</small></div>›</button>`).join(""):'<div class="muted">No cards found</div>'}catch(e){box.innerHTML='<div class="error"><b>Could not load TCGCSV.</b><br>'+e.message+'</div>'}},250)}
function select(i){let c=window.results[i];document.getElementById("results").innerHTML=`<div class="selected"><img class="hero" src="${img(c)}"><h3>${c.name}</h3><p>${c.setName} · ${c.cardNumber||""} · ${c.rarity||"Card"}<br>${c.subTypeName||"Normal"} · Market <b>${money(c.marketPrice)}</b></p><div class="qty"><button onclick="q(-1)">−</button><strong id="qn">1</strong><button onclick="q(1)">＋</button></div><button class="primary" onclick="add(window.results[${i}],Number(document.getElementById('qn').textContent))">Add to collection</button><button class="secondary" onclick="openAdd()">Back</button></div>`}
function q(d){let e=document.getElementById("qn");e.textContent=Math.max(1,+e.textContent+d)}
function render(){document.getElementById("main").innerHTML=page==="home"?home():collection();nav()}render();
</script></body></html>
