name: Update Riftbound Data

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update TCGCSV catalog
        env:
          TCGCSV_UA: RiftCollect/1.0
        run: python scripts/update_riftbound.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/riftbound.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: update Riftbound catalog"
            git push
          fi
